name: Validate action

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Shanghai
    steps:
      - uses: actions/checkout@v5

      - name: Check action metadata
        run: |
          test -f action.yml
          grep -q 'name: Send notify email' action.yml
          grep -q 'X-Notify-Source: github-actions' action.yml
          grep -q 'TZ: Asia/Shanghai' action.yml
