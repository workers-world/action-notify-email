name: Promote to master

# 日常发版：人工开 Release PR（dev_* → master），Validate 在 PR 上把关（含发版闸）。
# 本 workflow 仅应急 promote（须显式指明 release_branch）。
# 旧的自动 promote（push dev_* → Validate → workflow_run 自动合 master）已收掉：
# 「自动合 master + bump 了才发版」会让未 bump 的合入积压 master、搭下一次发版的车出去。
# 由 worker-promote 执行；须 Org Secret WORKERS_WORLD_GHA_TOKEN。
on:
  workflow_dispatch:
    inputs:
      release_branch:
        description: 要 promote 的发布轨分支（如 dev_00_12_00）
        required: true
        type: string

jobs:
  promote:
    # 写操作走 PAT；勿 contents:write 直推
    permissions: {}
    uses: workers-world/worker-actions/.github/workflows/worker-promote.yml@actions/v0.2.70
    with:
      release_branch: ${{ inputs.release_branch }}
    secrets: inherit
