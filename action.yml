name: Send notify email
description: 通过 notify-worker 发送邮件（GitHub Actions 代理层）
branding:
  icon: mail
  color: blue

inputs:
  subject:
    description: 邮件标题
    required: true
  body:
    description: 邮件正文（纯文本）；与 html 至少提供一个
    required: false
    default: ''
  body-file:
    description: 从文件读取纯文本正文；与 body 同时存在时优先 body-file
    required: false
    default: ''
  html:
    description: 邮件正文（HTML）；与 body 至少提供一个
    required: false
    default: ''
  html-file:
    description: 从文件读取 HTML 正文；与 html 同时存在时优先 html-file
    required: false
    default: ''
  attachment-file:
    description: 磁盘上的附件文件路径（如 CSV）；经 base64 编码写入 JSON attachments
    required: false
    default: ''
  attachment-filename:
    description: 附件在邮件中的文件名；缺省为 attachment-file 的 basename
    required: false
    default: ''
  attachment-content-type:
    description: 附件 MIME 类型；缺省按扩展名推断（如 .csv → text/csv）
    required: false
    default: ''
  to:
    description: 收件人，缺省使用 notify-worker 的 DEFAULT_TO
    required: false
    default: ''
  dedup-key:
    description: 去重键，建议 workflow-sha 或 workflow-run_id
    required: false
    default: ''
  fail-on-error:
    description: 发信失败时是否 fail job
    required: false
    default: 'true'

outputs:
  ok:
    description: 是否成功（含去重跳过）
    value: ${{ steps.send.outputs.ok }}
  skipped:
    description: 是否因去重跳过
    value: ${{ steps.send.outputs.skipped }}
  id:
    description: Resend message id
    value: ${{ steps.send.outputs.id }}
  error:
    description: 错误信息
    value: ${{ steps.send.outputs.error }}

runs:
  using: composite
  steps:
    - id: send
      shell: bash
      env:
        TZ: Asia/Shanghai
        SUBJECT: ${{ inputs.subject }}
        BODY: ${{ inputs.body }}
        BODY_FILE: ${{ inputs.body-file }}
        HTML: ${{ inputs.html }}
        HTML_FILE: ${{ inputs.html-file }}
        ATTACHMENT_FILE: ${{ inputs.attachment-file }}
        ATTACHMENT_FILENAME: ${{ inputs.attachment-filename }}
        ATTACHMENT_CONTENT_TYPE: ${{ inputs.attachment-content-type }}
        TO: ${{ inputs.to }}
        DEDUP_KEY: ${{ inputs.dedup-key }}
        FAIL_ON_ERROR: ${{ inputs.fail-on-error }}
        NOTIFY_WORKER_URL: ${{ env.NOTIFY_WORKER_URL }}
        NOTIFY_AUTH_TOKEN: ${{ env.NOTIFY_AUTH_TOKEN }}
      run: |
        set -euo pipefail

        write_failure() {
          local message="$1"
          echo "ok=false" >> "$GITHUB_OUTPUT"
          echo "skipped=false" >> "$GITHUB_OUTPUT"
          echo "id=" >> "$GITHUB_OUTPUT"
          echo "error=${message}" >> "$GITHUB_OUTPUT"
        }

        if [ -z "${NOTIFY_WORKER_URL:-}" ]; then
          write_failure "NOTIFY_WORKER_URL is required"
          # vars 求值空时无 workflow_call required；fail-on-error=false 也要醒目标注
          echo "::error::NOTIFY_WORKER_URL is required (set Org Variable NOTIFY_WORKER_URL; do not pass as secret to called workflows that no longer declare it)"
          if [ "$FAIL_ON_ERROR" = "true" ]; then
            exit 1
          fi
          echo "::warning::NOTIFY_WORKER_URL empty; notify skipped (fail-on-error=false)"
          exit 0
        fi

        if [ -z "${NOTIFY_AUTH_TOKEN:-}" ]; then
          write_failure "NOTIFY_AUTH_TOKEN is required (use NOTIFY_GHA_TOKEN secret value)"
          echo "::error::NOTIFY_AUTH_TOKEN is required"
          if [ "$FAIL_ON_ERROR" = "true" ]; then
            exit 1
          fi
          echo "::warning::NOTIFY_AUTH_TOKEN empty; notify skipped (fail-on-error=false)"
          exit 0
        fi

        base_url="${NOTIFY_WORKER_URL%/}"
        endpoint="${base_url}/v1/send"

        PAYLOAD_FILE="$(mktemp "${RUNNER_TEMP:-/tmp}/notify-email-payload.XXXXXX.json")"
        trap 'rm -f "$PAYLOAD_FILE"' EXIT
        export PAYLOAD_FILE

        python3 - <<'PY'
        import base64
        import json
        import mimetypes
        import os
        from pathlib import Path

        def infer_content_type(path: str) -> str:
            ext = Path(path).suffix.lower()
            if ext == ".csv":
                return "text/csv"
            guessed, _ = mimetypes.guess_type(path)
            return guessed or "application/octet-stream"

        subject = os.environ["SUBJECT"].strip()
        body_file = os.environ.get("BODY_FILE", "").strip()
        if body_file:
            with open(body_file, encoding="utf-8") as handle:
                body = handle.read()
        else:
            body = os.environ.get("BODY", "").strip()
        html_file = os.environ.get("HTML_FILE", "").strip()
        if html_file:
            with open(html_file, encoding="utf-8") as handle:
                html = handle.read()
        else:
            html = os.environ.get("HTML", "").strip()
        if not subject:
            raise SystemExit("subject is required")
        if not body and not html:
            raise SystemExit("body and html cannot both be empty")

        data = {"subject": subject}
        if body:
            data["body"] = body
        if html:
            data["html"] = html
        to = os.environ.get("TO", "").strip()
        if to:
            data["to"] = to
        dedup = os.environ.get("DEDUP_KEY", "").strip()
        if dedup:
            data["dedupKey"] = dedup

        attachment_file = os.environ.get("ATTACHMENT_FILE", "").strip()
        if attachment_file:
            filename = os.environ.get("ATTACHMENT_FILENAME", "").strip()
            if not filename:
                filename = os.path.basename(attachment_file)
            content_type = os.environ.get("ATTACHMENT_CONTENT_TYPE", "").strip()
            if not content_type:
                content_type = infer_content_type(attachment_file)
            with open(attachment_file, "rb") as handle:
                content_base64 = base64.b64encode(handle.read()).decode("ascii")
            attachment = {
                "filename": filename,
                "contentBase64": content_base64,
            }
            if content_type:
                attachment["contentType"] = content_type
            data["attachments"] = [attachment]

        with open(os.environ["PAYLOAD_FILE"], "w", encoding="utf-8") as handle:
            json.dump(data, handle, ensure_ascii=False)
        PY

        send_once() {
          curl -sS -w "\n%{http_code}" -X POST "$endpoint" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer ${NOTIFY_AUTH_TOKEN}" \
            -H "X-Notify-Source: github-actions" \
            --data-binary "@${PAYLOAD_FILE}"
        }

        parse_response() {
          local raw="$1"
          HTTP_CODE="$(printf '%s' "$raw" | tail -n1)"
          BODY="$(printf '%s' "$raw" | sed '$d')"

          OK="$(printf '%s' "$BODY" | python3 -c 'import json,sys; d=json.load(sys.stdin); print("true" if d.get("ok") else "false")' 2>/dev/null || echo false)"
          SKIPPED="$(printf '%s' "$BODY" | python3 -c 'import json,sys; d=json.load(sys.stdin); print("true" if d.get("skipped") else "false")' 2>/dev/null || echo false)"
          ID="$(printf '%s' "$BODY" | python3 -c 'import json,sys; d=json.load(sys.stdin); print(d.get("id") or "")' 2>/dev/null || true)"
          ERROR="$(printf '%s' "$BODY" | python3 -c 'import json,sys; d=json.load(sys.stdin); print(d.get("error") or "")' 2>/dev/null || true)"

          if [ "$HTTP_CODE" -ge 200 ] && [ "$HTTP_CODE" -lt 300 ] && [ "$OK" = "true" ]; then
            return 0
          fi

          if [ -z "$ERROR" ]; then
            ERROR="HTTP ${HTTP_CODE}"
          fi
          return 1
        }

        if ! parse_response "$(send_once)"; then
          sleep 0.3
          if ! parse_response "$(send_once)"; then
            write_failure "$ERROR"
            echo "::error::notify-worker send failed: ${ERROR}"
            if [ "$FAIL_ON_ERROR" = "true" ]; then
              exit 1
            fi
            exit 0
          fi
        fi

        echo "ok=${OK}" >> "$GITHUB_OUTPUT"
        echo "skipped=${SKIPPED}" >> "$GITHUB_OUTPUT"
        echo "id=${ID}" >> "$GITHUB_OUTPUT"
        echo "error=" >> "$GITHUB_OUTPUT"

        if [ "$SKIPPED" = "true" ]; then
          echo "notify skipped (dedup) at $(date '+%Y-%m-%d %H:%M:%S %Z')"
        else
          echo "notify sent id=${ID} at $(date '+%Y-%m-%d %H:%M:%S %Z')"
        fi
